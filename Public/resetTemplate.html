<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reset Password - TIME & RULE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-primary); margin: 0; padding: 20px;">

    <!-- Professional Glass Card Container -->
    <div class="glass-card" style="width: 100%; max-width: 420px; padding: 32px; text-align: center; position: relative;">
        
        <!-- Status / Error Banner -->
        <div id="status-banner" style="display: none; padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; font-family: var(--font-heading); text-align: left;"></div>

        <!-- Top Header (Time & Rule Logo & Title) -->
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="font-size: 40px; margin-bottom: 8px; filter: drop-shadow(0 0 10px rgba(0,242,254,0.5));">⏱️⚖️</div>
            <h1 style="font-size: 26px; font-weight: 700; font-family: var(--font-heading);">TIME & <span class="gradient-text">RULE</span></h1>
        </div>

        <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px; font-family: var(--font-heading);">Set New Password</h2>
        <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 24px;">Please choose a secure password with at least 6 characters.</p>
        
        <div class="input-group" style="text-align: left;">
            <label>New Password</label>
            <div class="password-field-wrapper">
                <input type="password" id="new-password-input" required placeholder="••••••••">
                <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility('new-password-input', this)">Show</button>
            </div>
        </div>
        
        <button type="button" id="submit-new-pass-btn" class="futuristic-btn primary full-width" style="margin-top: 10px;">UPDATE PASSWORD</button>
        
        <!-- Bottom Brand Footer (FROM TAZRO + Brand Logo Below) -->
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; margin-top: 28px; font-family: var(--font-heading); font-size: 11px; letter-spacing: 2px; color: var(--text-muted);">
            <span>FROM TAZRO</span>
            <img src="assets/brand-logo.png" alt="Brand Logo" style="height: 32px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(0,242,254,0.3));" onerror="this.style.display='none'">
        </div>
    </div>

    <!-- Firebase Logic & Professional Feedback Handler -->
    <script type="module">
        import { auth } from './config.js';
        import { confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');

        const banner = document.getElementById('status-banner');
        const submitBtn = document.getElementById('submit-new-pass-btn');

        // Toggle Password Visibility helper for text button
        window.togglePasswordVisibility = function(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.innerText = "Hide";
            } else {
                input.type = "password";
                btn.innerText = "Show";
            }
        };

        function showMessage(text, type = 'error') {
            banner.style.display = 'block';
            banner.innerText = text;
            if (type === 'error') {
                banner.style.background = 'rgba(255, 75, 92, 0.15)';
                banner.style.border = '1px solid rgba(255, 75, 92, 0.4)';
                banner.style.color = 'var(--accent-danger)';
            } else {
                banner.style.background = 'rgba(0, 230, 118, 0.15)';
                banner.style.border = '1px solid rgba(0, 230, 118, 0.4)';
                banner.style.color = 'var(--accent-success)';
            }
        }

        submitBtn.addEventListener('click', async () => {
            const newPassword = document.getElementById('new-password-input').value.trim();

            if (!newPassword) {
                showMessage("Please enter a new password.");
                return;
            }
            if (newPassword.length < 6) {
                showMessage("Password must be at least 6 characters long.");
                return;
            }

            submitBtn.innerText = "UPDATING...";
            submitBtn.disabled = true;

            try {
                await confirmPasswordReset(auth, oobCode, newPassword);
                showMessage("Password updated successfully! Redirecting to login...", "success");
                
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 3000);
            } catch (error) {
                submitBtn.innerText = "UPDATE PASSWORD";
                submitBtn.disabled = false;
                
                let errMsg = error.message;
                if (error.code === 'auth/expired-action-code') {
                    errMsg = "This password reset link has expired. Please request a new one.";
                } else if (error.code === 'auth/invalid-action-code') {
                    errMsg = "This reset link is invalid or has already been used.";
                }
                showMessage(errMsg);
            }
        });
    </script>
</body>
</html>
