<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#070913">

    <title>TIME & RULE — Offline</title>

    <style>
        :root {
            --bg: #070913;
            --card: rgba(18, 24, 48, 0.72);
            --border: rgba(0, 242, 254, 0.18);
            --cyan: #00f2fe;
            --blue: #4facfe;
            --text: #f0f4f8;
            --muted: #8a99ad;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    rgba(0, 242, 254, 0.08),
                    transparent 45%
                ),
                var(--bg);
            color: var(--text);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .offline-card {
            width: 100%;
            max-width: 460px;
            padding: 42px 28px;
            text-align: center;

            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45),
                0 0 35px rgba(0, 242, 254, 0.06);
        }

        .logo {
            width: 82px;
            height: 82px;
            margin: 0 auto 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background: linear-gradient(
                135deg,
                rgba(0, 242, 254, 0.14),
                rgba(79, 172, 254, 0.08)
            );

            border: 1px solid rgba(0, 242, 254, 0.22);

            font-size: 38px;

            box-shadow:
                0 0 30px rgba(0, 242, 254, 0.08);
        }

        h1 {
            margin: 0 0 10px;

            font-size: clamp(28px, 8vw, 42px);
            letter-spacing: -1px;
            font-weight: 700;
        }

        .gradient-text {
            background: linear-gradient(
                90deg,
                var(--cyan),
                var(--blue)
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 20px;
        }

        p {
            margin: 0 auto 28px;
            max-width: 340px;
            color: var(--muted);
            line-height: 1.6;
            font-size: 14px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            margin-bottom: 24px;
            padding: 9px 14px;

            border-radius: 999px;

            background: rgba(255, 75, 92, 0.08);
            border: 1px solid rgba(255, 75, 92, 0.18);

            color: #ff8a96;
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4b5c;

            box-shadow:
                0 0 10px rgba(255, 75, 92, 0.7);
        }

        .retry-btn {
            width: 100%;
            min-height: 48px;

            border: 0;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                var(--cyan),
                var(--blue)
            );

            color: #061018;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .retry-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 30px rgba(0, 242, 254, 0.18);
        }

        .retry-btn:active {
            transform: translateY(0);
        }

        .hint {
            margin-top: 18px;
            color: #657388;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="offline-card">

        <div class="logo">
            ⏱️⚖️
        </div>

        <h1>
            TIME & <span class="gradient-text">RULE</span>
        </h1>

        <div class="status">
            <span class="status-dot"></span>
            You're Offline
        </div>

        <h2>No Internet Connection</h2>

        <p>
            TIME & RULE couldn't connect to the server.
            Check your internet connection and try again.
        </p>

        <button
            class="retry-btn"
            type="button"
            onclick="window.location.reload()"
        >
            TRY AGAIN
        </button>

        <div class="hint">
            Your cached app data may still be available.
        </div>

    </main>

</body>
</html>
